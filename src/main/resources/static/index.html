<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>spring boot chat app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="username-page">
    <div class="username-page-container">
        <h1 class="title">type your username to enter the chat</h1>
        <form id="usernameForm" name="usernameForm">
            <div>
                <input type="text" id="name" placeholder="username" autocomplete="off" class="form">
            </div>
            <div class="form-group">
                <button type="submit" class="accent username submit">
                    start chatting
                </button>
            </div>
        </form>
    </div>

</div>

<div id="chat-page" class="hidden">
    <div class="chat-container">
        <div class="chat-header">
            <h2>Spring WebSocket Chatappp</h2>
        </div>
        <div class="connecting">
            Connecting...
        </div>
        <ul id="messageArea">

        </ul>
        <form id="messageForm" name="messageForm">
            <div class="form-group">
                <div class="input-group clearfix">
                    <input type="text" id="message" placeholder="Type a message..." autocomplete="off" class="form-control"/>
                    <button type="submit" class="primary">Send</button>
                </div>
            </div>
        </form>
    </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
